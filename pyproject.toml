[project]
name = "document-question-and-answer"
version = "0.2.0"
description = "Question answering over PDF documents with retrieval (FAISS, Sentence Transformers) and Groq-hosted LLMs, in a Streamlit app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.11.0.post1",
    "groq>=0.30.0",
    "langchain-community>=0.3.27",
    "langchain-core>=0.3.72",
    "langchain-text-splitters>=0.3.9",
    "numpy>=2.2.6",
    "pypdf>=5.9.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=5.0.0",
    "streamlit>=1.47.1",
    "torch>=2.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/agents"]

# CPU-only torch: the app runs a small embedding model, so the CUDA build (~3 GB) is not needed
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
